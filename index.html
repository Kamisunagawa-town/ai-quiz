<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上砂川町 生成AI利用ガイドライン 確認テスト</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #004494;
            --bg: #f0f4f8;
            --correct: #28a745;
            --incorrect: #dc3545;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: var(--bg);
            color: #333;
            line-height: 1.7;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        h1 { color: var(--primary); font-size: 1.5em; }
        h2 { color: var(--primary); }
        .hidden { display: none; }
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 16px;
            transition: 0.2s;
        }
        .btn:hover { background: var(--primary-dark); }
        .lead {
            background: #e8f0fe;
            padding: 16px;
            border-radius: 8px;
            border-left: 5px solid var(--primary);
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text { font-weight: bold; color: #6c757d; font-size: 0.9em; margin-bottom: 16px; }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 16px;
            margin: 10px 0;
            background: #f1f3f5;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .option-btn:hover:not(:disabled) { background: #e2e6ea; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: #d4edda; border-color: var(--correct); color: #155724; font-weight: bold; }
        .option-btn.incorrect { background: #f8d7da; border-color: var(--incorrect); color: #721c24; }
        #explanation {
            background: #fff8e1;
            padding: 16px;
            border-left: 5px solid #ffc107;
            margin-top: 20px;
            border-radius: 4px;
        }
        #explanation h3 { margin-top: 0; }
        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            width: 100%;
            max-width: 320px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-top: 8px;
        }
        #cert-canvas {
            max-width: 100%;
            border: 1px solid #ddd;
            margin-top: 20px;
            border-radius: 4px;
        }
        .center { text-align: center; }
        .badge { font-size: 3em; }
        .note { font-size: 0.85em; color: #888; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">

    <!-- スタート画面 -->
    <div id="start-screen">
        <h1>上砂川町 生成AI利用ガイドライン<br>確認テスト</h1>
        <div class="lead">
            <p>このテストは、職員が<strong>QommonsAI</strong>を安全に利用するための理解度確認です。</p>
            <p>問題プールから<strong>ランダムで10問</strong>を出題します。<strong>全問正解</strong>で修了証が発行されます。1問でも間違えた場合は再挑戦となりますので、落ち着いて回答してください。</p>
        </div>
        <button class="btn" onclick="startQuiz()">テストを開始する</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="hidden">
        <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
        <div class="progress-text" id="progress">問題 1 / 10</div>
        <h2 id="q-text"></h2>
        <div id="options"></div>
        <div id="explanation" class="hidden">
            <h3 id="result-title"></h3>
            <p id="exp-text"></p>
            <button class="btn" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden center">
        <div id="fail-block" class="hidden">
            <div class="badge">😢</div>
            <h1>もう一歩です</h1>
            <h2 id="score-fail"></h2>
            <p>QommonsAIの利用には全問正解が必要です。<br>ガイドラインを読み返して、ぜひ再挑戦してください。</p>
            <button class="btn" onclick="location.reload()">もう一度挑戦する</button>
        </div>
        <div id="success-block" class="hidden">
            <div class="badge">🎉</div>
            <h1>全問正解おめでとうございます！</h1>
            <p>ガイドラインの内容を正しく理解されています。<br>氏名を入力して修了証を発行してください。</p>
            <input type="text" id="user-name" placeholder="氏名（例：上砂川 太郎）"><br>
            <button class="btn" onclick="completeQuiz()">修了証を発行する</button>
            <br>
            <canvas id="cert-canvas" class="hidden"></canvas>
            <br>
            <a id="dl-link" class="hidden"><button class="btn">画像をダウンロードして保存</button></a>
            <p id="send-status" class="note hidden">合格記録を送信しました。</p>
        </div>
    </div>

</div>

<!-- 問題プールの読み込み -->
<script src="quiz.js"></script>

<script>
    // ============================================================
    // 設定エリア：Googleフォーム連携（後述の手順でURLとentry番号を設定）
    //  連携しない場合は USE_GOOGLE_FORM を false のままにしてください
    // ============================================================
    const USE_GOOGLE_FORM = true;  // 連携する場合は true に変更
    const FORM_URL   = "https://docs.google.com/forms/d/e/1FAIpQLSfGC2ilIm4YcDZT7ZzxSlwh01zMYlyn-JAF_MuMDXc1XWupWw/formResponse";
    const ENTRY_NAME  = "entry.258530877"; // 氏名のentry番号
    const ENTRY_DATE  = "entry.1796079975"; // 合格日のentry番号
    const ENTRY_SCORE = "entry.1994332851"; // 得点のentry番号
    // ============================================================

    const QUIZ_COUNT = 10; // 出題数
    let questions = [];
    let current = 0, score = 0, answered = false, failed = false;

    // プールからランダムに QUIZ_COUNT 問抽出
    function pickQuestions(pool, num) {
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, num);
    }

    function startQuiz() {
        if (typeof questionPool === "undefined" || questionPool.length < QUIZ_COUNT) {
            alert("問題データの読み込みに失敗したか、問題数が不足しています。quiz.jsを確認してください。");
            return;
        }
        questions = pickQuestions(questionPool, QUIZ_COUNT);
        current = 0; score = 0; failed = false;
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        showQuestion();
    }

    function showQuestion() {
        answered = false;
        document.getElementById("explanation").classList.add("hidden");
        const total = questions.length;
        document.getElementById("progress").innerText = `問題 ${current + 1} / ${total}`;
        document.getElementById("bar").style.width = (current / total * 100) + "%";
        document.getElementById("q-text").innerText = questions[current].q;
        const optDiv = document.getElementById("options");
        optDiv.innerHTML = "";
        questions[current].options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            optDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (answered) return;
        answered = true;
        const correct = questions[current].ans;
        const btns = document.getElementById("options").children;
        for (let b of btns) b.disabled = true;
        if (selected === correct) {
            btns[selected].classList.add("correct");
            document.getElementById("result-title").innerText = "⭕ 正解！";
            document.getElementById("result-title").style.color = "var(--correct)";
            score++;
        } else {
            btns[selected].classList.add("incorrect");
            btns[correct].classList.add("correct");
            document.getElementById("result-title").innerText = "❌ 不正解";
            document.getElementById("result-title").style.color = "var(--incorrect)";
            failed = true;
        }
        document.getElementById("exp-text").innerText = questions[current].exp;
        document.getElementById("explanation").classList.remove("hidden");
        document.getElementById("next-btn").innerText =
            (current === questions.length - 1) ? "結果を見る" : "次の問題へ";
    }

    function nextQuestion() {
        current++;
        if (current < questions.length) showQuestion();
        else showResult();
    }

    function showResult() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        if (!failed && score === questions.length) {
            document.getElementById("success-block").classList.remove("hidden");
        } else {
            document.getElementById("fail-block").classList.remove("hidden");
            document.getElementById("score-fail").innerText = `${questions.length}問中 ${score}問 正解`;
        }
    }

    function toWareki(d) {
        const reiwa = d.getFullYear() - 2018;
        const r = (reiwa === 1) ? "元" : reiwa;
        return `令和${r}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function completeQuiz() {
        const name = document.getElementById("user-name").value.trim();
        if (!name) { alert("氏名を入力してください。"); return; }
        const now = new Date();
        generateCertificate(name, now);
        if (USE_GOOGLE_FORM) {
            sendToGoogleForm(name, toWareki(now), `${score}/${questions.length}`);
        }
    }

    function generateCertificate(name, now) {
        const canvas = document.getElementById("cert-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 900;
        canvas.height = 640;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 900, 640);
        ctx.strokeStyle = "#0056b3";
        ctx.lineWidth = 16;
        ctx.strokeRect(24, 24, 852, 592);
        ctx.strokeStyle = "#cdddf5";
        ctx.lineWidth = 4;
        ctx.strokeRect(40, 40, 820, 560);

        ctx.fillStyle = "#222";
        ctx.textAlign = "center";

        ctx.font = "bold 46px sans-serif";
        ctx.fillText("修 了 証", 450, 130);
        ctx.font = "30px sans-serif";
        ctx.fillText(`${name}　殿`, 450, 230);
        ctx.font = "20px sans-serif";
        ctx.fillText("あなたは上砂川町生成AI利用ガイドラインに関する確認テストにおいて", 450, 310);
        ctx.fillText("全問正解し、ガイドラインの内容を正しく理解したことを証します。", 450, 350);
        ctx.fillText("これにより、QommonsAIの業務利用を許可します。", 450, 390);
        ctx.font = "20px sans-serif";
        ctx.fillText(toWareki(now), 450, 470);
        ctx.font = "bold 24px sans-serif";
        ctx.fillText("上砂川町 総務課デジタル推進担当係", 450, 520);

        const serial = `No. ${now.getFullYear()}${("0"+(now.getMonth()+1)).slice(-2)}${("0"+now.getDate()).slice(-2)}-${("0"+now.getHours()).slice(-2)}${("0"+now.getMinutes()).slice(-2)}${("0"+now.getSeconds()).slice(-2)}`;
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#888";
        ctx.textAlign = "right";
        ctx.fillText(serial, 840, 580);

        canvas.classList.remove("hidden");
        const dl = document.getElementById("dl-link");
        dl.href = canvas.toDataURL("image/png");
        dl.download = `生成AI研修修了証_${name}.png`;
        dl.classList.remove("hidden");
    }

    function sendToGoogleForm(name, dateStr, scoreStr) {
        const data = new FormData();
        data.append(ENTRY_NAME, name);
        data.append(ENTRY_DATE, dateStr);
        data.append(ENTRY_SCORE, scoreStr);
        fetch(FORM_URL, { method: "POST", mode: "no-cors", body: data })
            .then(() => {
                document.getElementById("send-status").classList.remove("hidden");
            })
            .catch(() => {
                console.log("送信に失敗しました");
            });
    }
</script>
</body>
</html>
