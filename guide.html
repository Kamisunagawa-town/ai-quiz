<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上砂川町 生成AI利用ガイドライン 学習スライド</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #004494;
            --bg: #f0f4f8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: var(--bg);
            color: #333;
            line-height: 1.8;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            font-weight: bold;
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 12px;
            text-align: center;
        }
        .slide {
            background: #fff;
            padding: 36px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            min-height: 440px;
        }
        .slide h1 { color: var(--primary); font-size: 1.6em; margin-top: 0; }
        .slide h2 {
            color: var(--primary);
            font-size: 1.35em;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 8px;
            margin-top: 0;
        }
        .slide h3 { color: var(--primary-dark); font-size: 1.1em; margin-bottom: 4px; }
        .slide p { margin: 10px 0; }
        .slide ul { padding-left: 1.3em; }
        .slide li { margin: 8px 0; }
        .lead {
            background: #e8f0fe;
            padding: 16px 20px;
            border-radius: 8px;
            border-left: 5px solid var(--primary);
        }
        .box {
            background: #fff8e1;
            padding: 14px 18px;
            border-left: 5px solid #ffc107;
            border-radius: 4px;
            margin: 14px 0;
        }
        .example {
            background: #f1f3f5;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95em;
            margin: 6px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.92em;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #e8f0fe; color: var(--primary-dark); }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { background: #c5ccd6; cursor: default; }
        .btn-quiz { background: #28a745; }
        .btn-quiz:hover { background: #1e7e34; }
        .center { text-align: center; }
        .cover { text-align: center; padding-top: 60px; }
        .cover .badge { font-size: 3.4em; }
        .cover .sub { color: #6c757d; margin-top: 24px; }
        .note { font-size: 0.85em; color: #888; }
        .hint { text-align: center; font-size: 0.85em; color: #999; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
    <div class="progress-text" id="page-indicator"></div>

    <div class="slide" id="slide"></div>

    <div class="nav">
        <button class="btn" id="prev-btn" onclick="prevSlide()">← 前へ</button>
        <span id="nav-center" class="center" style="flex:1;"></span>
        <button class="btn" id="next-btn" onclick="nextSlide()">次へ →</button>
    </div>
    <div class="hint">← → キーでもめくれます</div>
</div>

<script>
    // ============================================================
    // ガイドライン学習スライド（原文に忠実・章ごと分割）
    // ============================================================
    const slides = [
        // 0 表紙
        `<div class="cover">
            <div class="badge">📘</div>
            <h1>上砂川町<br>生成AI利用ガイドライン</h1>
            <p class="sub">2026年（令和8年）6月<br>総務課デジタル推進担当係</p>
            <p class="note" style="margin-top:40px;">「次へ」または → キーで読み進めてください。<br>全章を読み終えると、確認テストへ進めます。</p>
        </div>`,

        // 1 策定の背景と目的
        `<h2>1 ガイドライン策定の背景と目的</h2>
        <p>上砂川町は、人口減少と少子高齢化が進む中で、人手不足や多様化・複雑化する町民ニーズ、高度化する行政サービスへの対応など、様々な課題に直面しています。このような状況の中でも、町民生活の質の向上と行政サービスの充実を安定的かつ継続的に図り、「持続可能な行財政運営を推進するまちづくり」を実現していかなければなりません。</p>
        <p>そのためには、限られた職員体制の中で、本来人が行うべき業務を見極めながら、生成AIをはじめとするデジタル技術を積極的に活用していく必要があります。</p>
        <p>本ガイドラインは、業務効率化と行政サービスの向上に大きな可能性を秘めている生成AIを、町民の信頼を得ながら正しく効果的に活用するため、職員が安心かつ積極的に活用するために必要な事項を定めるものです。</p>`,

        // 2 位置づけと基本原則
        `<h2>2 位置づけと基本原則</h2>
        <p>本ガイドラインは、本町における生成AIの利用に関するルールとして、全職員が遵守すべきものです。</p>
        <h3>1. 町民のためのAI活用</h3>
        <p>生成AIの利活用は、技術ありきではなく、町民生活の向上と行政サービスの質的改善を実現する手段です。現場の声に耳を傾け、町民にとって意味のある成果につなげていきます。</p>
        <h3>2. 人による判断と説明責任</h3>
        <p>生成AIは、職員の業務を支援するための道具であり、判断を委ねる対象ではありません。AIが提示した内容は職員が事実関係・根拠・妥当性を確認したうえで採用するか判断し、業務上の決定及びその説明責任は職員が担います。また、町の運用方針や取組内容を町民にわかりやすく説明し、信頼性と透明性の向上に努めます。</p>
        <h3>3. 情報の安全と公平な運用</h3>
        <p>生成AIの活用が、特定の属性に対する偏った扱いや差別的な結果を招くことのないよう、運用の各段階で公平性に配意します。あわせて、町民の個人情報・プライバシー・町が管理する情報資産の流出を防ぐため、関連法令及び上砂川町情報セキュリティポリシーを徹底して遵守します。</p>
        <h3>4. 学び続ける組織への成長</h3>
        <p>生成AIをめぐる技術や活用方法は急速に変化していくため、個々の職員のスキル向上に加え、組織としての知見の蓄積と共有が欠かせません。研修・情報共有・活用事例の横展開などを通じて、上砂川町全体として安全かつ実効性のあるAI活用を進めます。</p>`,

        // 3 適用範囲
        `<h2>3 適用範囲</h2>
        <p>本ガイドラインは、上砂川町の全部局、教育委員会、議会事務局、公平委員会等の職員（正規職員、非正規職員、派遣職員等を含む）に適用されます。</p>
        <p>ただし、法令等で特別な取扱いが定められている情報を扱うシステムや業務については、本ガイドラインの全部または一部の適用範囲外とする場合があります。</p>`,

        // 4 対象とする生成AI
        `<h2>4 対象とする生成AI</h2>
        <p>職員が業務で利用できる生成AIは、原則として入力した情報を学習データとして利用されないよう構成されているもの又は設定できるものに限ります。</p>
        <p>現時点で対象とする生成AIは、Polimill株式会社提供の「QommonsAI」とします。今後、業務上の必要性に応じて対象サービスを追加する場合があります。</p>
        <div class="box">
            <p>ChatGPTやBing Chatなどの<strong>約款型外部サービス</strong>は、上砂川町の情報セキュリティポリシーに基づき、データ越境リスクや利用規約上の制約等があるため、<strong>業務データの入力は行わないでください。</strong></p>
        </div>
        <p>ガイドラインに定めのない外部サービスを利用する必要がある場合は、上砂川町情報セキュリティポリシーに従い、必要なリスク評価、利用申請、承認プロセスを経た上で、適切な対策を講じ、個別に利用契約を締結してください。</p>
        <p>判断に迷う場合は、必ず<strong>総務課デジタル推進担当係</strong>に相談してください。</p>`,

        // 5 情報の機密性分類と取扱い
        `<h2>5 情報の機密性分類と取扱い</h2>
        <p>生成AIにデータを入力する際には、本町の情報セキュリティポリシー等に定められた情報の機密性分類に応じて、その取扱いを判断する必要があります。主な分類と考え方は以下のとおりです。（詳細は上砂川町情報セキュリティポリシーを参照してください。）</p>
        <table>
            <tr><th>分類</th><th>分類基準</th></tr>
            <tr><td>機密性3A</td><td>「行政文書の管理に関するガイドライン」（平成23年4月1日内閣総理大臣決定）に定める秘密文書に相当する文書</td></tr>
            <tr><td>機密性3B</td><td>漏えい等が生じた際に、個人の権利利益の侵害の度合いが大きく、取扱いに非常に留意すべき情報資産</td></tr>
            <tr><td>機密性3C</td><td>3B以上の機密性は要しないが、基本的に公表を前提とせず、取扱いに留意すべき情報資産</td></tr>
            <tr><td>機密性2</td><td>機密性3に相当する機密性は要しないが、直ちに一般に公表することを前提としていない情報資産</td></tr>
            <tr><td>機密性1</td><td>機密性2又は機密性3の情報資産以外の情報資産</td></tr>
        </table>`,

        // 6 機密性レベルごとの入力ルール
        `<h2>6 機密性レベルごとの入力ルール</h2>
        <p>生成AIへのデータ入力可否は、情報の機密性分類に応じて、以下の点を考慮し、適切な対応をとってください。</p>
        <table>
            <tr><th>分類</th><th>入力可否</th><th>注意事項</th></tr>
            <tr><td>機密性3A<br>3B<br>3C</td><td><strong>入力不可</strong></td><td>非特定化措置を施してもなお、漏えい時の影響が極めて甚大であると考えられるため、原則禁止とします。</td></tr>
            <tr><td>機密性2</td><td>非特定化措置を実施した上で入力可</td><td>非特定化措置を実施し、業務上の必要性に応じて利用してください。約款型外部サービスへの入力は原則禁止とします。</td></tr>
            <tr><td>機密性1</td><td>入力可</td><td>意図しない情報が含まれていないか確認することを推奨します。</td></tr>
        </table>`,

        // 7 非特定化措置（考え方）
        `<h2>7 機密性情報の取り扱いにおける非特定化措置</h2>
        <p>機密性の高い情報を生成AIで扱う場合は、情報漏洩等のリスクを最小限に抑えるため、非特定化措置が不可欠です。</p>
        <p>機密性の高い情報を入力する際には、対策を複数組み合わせるなど、情報の特定につながる要素を排除することが、安全な利用の前提となります。これらの措置を適切に行うことで、情報漏えいリスクを大幅に低減し、生成AI活用の可能性を広げることができます。</p>
        <div class="box">
            <p>ただし、非特定化措置が完全であることを保証するものではありません。文脈から情報が推測される可能性等も考慮し、措置の実施後も<strong>リスクが残存することを認識し、入力の必要性を慎重に判断</strong>してください。</p>
        </div>`,

        // 8 実施すべき非特定化措置
        `<h2>7 実施すべき非特定化措置</h2>
        <h3>匿名化</h3>
        <p>町民の氏名、事業者名、職員の氏名・役職、町内の地名・施設名、固有の製品名等は、業務上不可欠でない限り削除するか、記号や一般名称に置き換えてください。</p>
        <div class="example">（例）「上砂川町○○地区の山田太郎氏」 → 「町内のA氏」または「相談者」など</div>
        <h3>置換対応</h3>
        <p>文書内で繰り返し出現する特定の機密情報（例：未公表の事業名、予算額、補助金額等）は、一時的な記号に置き換えてください。</p>
        <div class="example">（例）「○○整備事業（予算3,500万円）」 → 「事業X（予算[金額A]）」</div>
        <h3>マスキング</h3>
        <p>完全には削除できないが特定性を下げたい情報は、「*****」や「○○」で覆い隠してください。ただし、他の情報と組み合わせることで推測が可能にならないか、十分に注意が必要です。特に上砂川町は人口規模が小さく、限定的な情報からも個人が特定されやすいため、より慎重な判断が求められます。</p>`,

        // 9 非特定化措置実施上の注意点
        `<h2>7 非特定化措置 実施上の注意点</h2>
        <h3>措置の徹底</h3>
        <p>一部の情報だけを処理しても、他の情報から推測できれば意味がありません。文脈全体を考慮し、特定につながる可能性のある要素を網羅的に処理してください。特に上砂川町のような小規模自治体では、複数の断片情報の組み合わせから個人が容易に特定される可能性があるため、通常以上に慎重な配慮が必要です。</p>
        <h3>組み合わせの有効性</h3>
        <p>単一の措置よりも、匿名化とマスキング、置換対応と匿名化などを組み合わせることで、より安全性が高まります。機密性が高い情報ほど、複数の措置を併用してください。</p>
        <h3>作業プロセス記録</h3>
        <p>どのような非特定化措置を施したか、作業プロセスを記録しておくことが望ましいです。</p>`,

        // 10 生成AI利用時の注意事項
        `<h2>8 生成AI利用時の注意事項</h2>
        <p>生成AIは行政事務の幅広い場面で活用が期待される一方、様々なリスクが潜んでおり、リスクの性質をあらかじめ理解したうえで利用することが重要です。</p>
        <h3>出力内容の信頼性確認（ハルシネーション対策）</h3>
        <p>生成AIは確率に基づいて文章や数値を組み立てる仕組みであるため、もっともらしく見えても事実と異なる内容（ハルシネーション）が含まれることがあります。また、学習時点の情報を基に応答するため、最新の制度改正や町独自の情報には対応していない場合もあります。出力結果は必ず一次情報や公式資料と照合し、職員自身の責任で正確性を確認してから業務に用いてください。</p>
        <h3>判断と責任は職員に帰属</h3>
        <p>生成AIはあくまで補助的なツールであり、業務上の決定とそれに伴う責任は、常に職員が負います。出力内容をそのまま採用することは避け、必ず職員が内容を精査し、判断を行ってください。重要な意思決定や外部に影響を与える業務では、利用状況や判断プロセスを記録に残し、説明責任を果たせるようにしておくことが望ましいです。</p>`,

        // 11 著作権・第三者の権利・バイアス
        `<h2>8 生成AI利用時の注意事項（つづき）</h2>
        <h3>生成物の著作権上の取扱い</h3>
        <p>AIが生成したコンテンツは、人による創作的な関与の度合いによっては著作物として保護されないケースがあるため、そのまま利用すると第三者による模倣を防げない可能性があります。町が独自性を確保したい制作物（広報用イラスト、キャラクター、マーク等）にAIを利用する場合は、生成物をたたき台としつつ、職員が十分な創作的アレンジを加えることで、著作物としての保護を得られるよう工夫してください。</p>
        <h3>第三者の権利を侵害しないための配慮</h3>
        <p>生成物が既存の著作物・商標・意匠、または他者のプライバシーや肖像（パブリシティ権を含む）に抵触するおそれがあります。特定の作品やキャラクターを模倣させるような指示（プロンプト）は行わないでください。公開・配布前には、画像検索やキーワード照合等により入念にチェックし、関連法令や文化庁「AIと著作権に関する考え方について」等に沿った運用を行ってください。</p>
        <h3>バイアスへの注意と公平性の担保</h3>
        <p>生成AIの応答には、学習データに由来する社会的・歴史的な偏りが反映・増幅されて現れることがあります。人種・性別・年齢・宗教・出身地・障害の有無等、特定の属性に対する不適切な表現や差別的なニュアンスが含まれていないか、複数の視点から点検してください。AIの利用が行政サービスの公平性を損なう結果につながらないよう、職員一人ひとりが意識を持って運用することが求められます。</p>`,

        // 12 セキュリティ対策
        `<h2>9 セキュリティ対策</h2>
        <ul>
            <li><strong>情報漏えいへの警戒</strong>：入力データはサービスの仕様によっては学習データに取り込まれ、第三者への回答に反映される可能性が指摘されています。</li>
            <li><strong>不正利用</strong>：悪意のあるプロンプトによりAIが意図しない動作をする可能性があります。不審な挙動が見られた場合は直ちに利用を中止し、総務課デジタル推進担当係に報告してください。</li>
            <li><strong>マルウェア感染</strong>：生成AIを騙るフィッシングサイトや、生成コードにマルウェアが含まれる可能性も考慮し、許可されたサービス以外は利用せず、不審なリンクやファイルを開かないよう注意してください。</li>
            <li><strong>ID/パスワードの管理</strong>：(1) 他人に教えない・共有しない (2) 第三者の目に触れる場所に記録・保管しない (3) 充分な長さと複雑性（英大文字、小文字、数字、記号の組合せ等）を確保する</li>
        </ul>
        <div class="box">
            <h3 style="margin-top:0;">インシデント発生時の対応</h3>
            <p>情報セキュリティに関わる問題（個人情報・機密情報の漏えい、虚偽・不適切な表現を含む生成物の公表等）が発生した場合は、直ちに上砂川町情報セキュリティポリシーに基づき、必要な措置を講じてください。</p>
        </div>`,

        // 13 推進体制・人材育成・見直し
        `<h2>10〜12 推進体制・人材育成研修・見直し</h2>
        <h3>10 推進体制</h3>
        <p>総務課デジタル推進担当係に相談窓口を設置します。次のような場合に活用してください。</p>
        <ul>
            <li>生成AIの利用方法に関する質問</li>
            <li>機密性情報の取扱いに関する判断</li>
            <li>リスク評価の実施方法</li>
            <li>インシデント発生時の対応</li>
            <li>その他、本ガイドラインに関する疑問</li>
        </ul>
        <h3>11 人材育成研修</h3>
        <p>全職員向け基礎研修、管理職層向け研修、実践的な事例共有を通じて、職員のAIリテラシー向上を進めます。</p>
        <h3>12 ガイドラインの見直し</h3>
        <p>技術動向、国の指針の変更、利用状況、インシデントの発生状況等を踏まえ、必要に応じて随時見直しを行います。見直しにあたっては、職員からの意見や提案を積極的に取り入れます。</p>`,

        // 14 締め（テストへ）
        `<div class="cover">
            <div class="badge">✅</div>
            <h1>ガイドラインの確認は以上です</h1>
            <p>内容を理解できたら、確認テストに挑戦しましょう。<br>問題プールから<strong>ランダムで10問</strong>を出題します。<strong>全問正解</strong>で修了証が発行されます。</p>
            <p style="margin-top:30px;">
                <a href="index.html" class="btn btn-quiz">確認テストを始める →</a>
            </p>
            <p class="note" style="margin-top:24px;">もう一度読み返したい場合は「← 前へ」で戻れます。</p>
        </div>`
    ];

    let current = 0;

    function render() {
        document.getElementById("slide").innerHTML = slides[current];
        const total = slides.length;
        document.getElementById("bar").style.width = ((current + 1) / total * 100) + "%";
        document.getElementById("page-indicator").innerText = `${current + 1} / ${total}`;
        document.getElementById("prev-btn").disabled = (current === 0);
        document.getElementById("next-btn").style.visibility = (current === total - 1) ? "hidden" : "visible";
        window.scrollTo(0, 0);
    }

    function nextSlide() {
        if (current < slides.length - 1) { current++; render(); }
    }
    function prevSlide() {
        if (current > 0) { current--; render(); }
    }

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextSlide();
        if (e.key === "ArrowLeft")  prevSlide();
    });

    render();
</script>
